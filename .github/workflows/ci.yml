name: CI Environment Check

on:
  push:
    branches: [main, setup-task]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # Specify a common Python version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Check if requirements.txt exists and install
          if [ -f requirements.txt ]; then
              pip install -r requirements.txt
          else
              echo "requirements.txt not found. Skipping dependency install."
          fi
      - name: Basic Check
        run: echo "Environment check successful. Dependencies installed."
